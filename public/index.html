<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p1m - Visual Canvas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
  <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .toolbar { display: flex; gap: 10px; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button.run { background: #22c55e; color: #fff; }
    #drawflow { flex: 1; width: 100%; height: 100%; background: #0b1120; background-size: 25px 25px; background-image: radial-gradient(#1e293b 1px, transparent 1px); }
    .drawflow .drawflow-node { background: #1e293b; border: 1px solid #38bdf8; color: #fff; border-radius: 8px; padding: 12px; min-width: 150px; }
    .drawflow .drawflow-node .input, .drawflow .drawflow-node .output { background: #38bdf8; }
    #console { position: fixed; bottom: 0; left: 0; right: 0; max-height: 140px; background: rgba(2, 6, 23, 0.9); padding: 10px; border-top: 1px solid #334155; font-family: monospace; font-size: 12px; overflow-y: auto; }
  </style>
</head>
<body>
  <header>
    <h2>⚡ p1m Builder</h2>
    <div class="toolbar">
      <button onclick="addNode('Webhook')">+ Webhook</button>
      <button onclick="addNode('HTTP Request')">+ HTTP Request</button>
      <button class="run" onclick="executeCanvas()">▶ Run Workflow</button>
    </div>
  </header>

  <div id="drawflow"></div>

  <div id="console">Log: Canvas ready. Nodes add karein aur "Run Workflow" dabayein.</div>

  <script>
    const container = document.getElementById("drawflow");
    const editor = new Drawflow(container);
    editor.reroute = true;
    editor.start();

    // Initial Trigger Node
    editor.addNode('trigger', 0, 1, 50, 100, 'trigger', {}, '<div><b>Trigger: Webhook</b></div>');

    function addNode(name) {
      const id = Date.now();
      editor.addNode(name, 1, 1, 250, 150, name.toLowerCase(), {}, `<div><b>Action: ${name}</b></div>`);
    }

    async function executeCanvas() {
      const data = editor.export();
      const log = document.getElementById('console');
      log.textContent = "Executing workflow: " + JSON.stringify(data.drawflow.Home.data);

      try {
        const res = await fetch('/api/run-workflow', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ graph: data.drawflow.Home.data })
        });
        const resData = await res.json();
        log.textContent = "Execution Success: " + JSON.stringify(resData, null, 2);
      } catch(err) {
        log.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
